openapi: 3.0.0
info:
  title: API Documentation
  version: 1.0.0
  description: Documentation de l'API avec authentification JWT
  contact:
    name: Levitre Mathys
    email: levitre.mathys30@gmail.com

servers:
  - url: http://localhost:3000
    description: Serveur de développement
  - url: https://api.production.com
    description: Serveur de production

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "Token JWT à obtenir via /auth/login"

  schemas:
    User:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: "Alice"
        email:
          type: string
          format: email
          example: "alice@example.com"
        password:
          type: string
          format: password
          example: "password123"

    Card:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: "Pikachu"
        hp:
          type: integer
          example: 60
        attack:
          type: integer
          example: 40
        type:
          type: string
          example: "Electric"
        pokedexNumber:
          type: integer
          example: 25
        imgUrl:
          type: string
          example: "https://example.com/pikachu.png"

    Deck:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: "Deck de Pikachu"
        userId:
          type: integer
          example: 1
        
    Error:
      type: object
      properties:
        message:
          type: string
          example: "Message d'erreur"

tags:
  - name: Authentication
    description: Gestion de l'authentification
  - name: Users
    description: Gestion des utilisateurs
  - name: Cards
    description: Gestion des cartes Pokémon
  - name: Decks
    description: Gestion des decks de cartes

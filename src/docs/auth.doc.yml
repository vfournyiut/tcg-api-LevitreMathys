paths:
  /api/auth/sign-up:
    post:
      tags:
        - Authentication
      summary: Inscription utilisateur
      description: Crée un nouvel utilisateur et retourne un token JWT
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - username
                - email
                - password
              properties:
                username:
                  type: string
                  example: "Alice"
                email:
                  type: string
                  format: email
                  example: "alice@example.com"
                password:
                  type: string
                  format: password
                  example: "password123"
      responses:
        '201':
          description: Inscription réussie
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Inscription réussie"
                  token:
                    type: string
                    example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
                  user:
                    $ref: '#/components/schemas/User'

        '400' :
          description: Informations manquantes ou invalides
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "[ERREUR] Information(s) manquante(s) ou invalide(s)"
                $ref: '#/components/schemas/Error'

        '409':
          description: Utilisateur déjà existant
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "❌User already exist"
                $ref: '#/components/schemas/Error'

        '500':
          description: Erreur serveur
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "❗Erreur serveur"
                $ref: '#/components/schemas/Error'



paths:
  /api/auth/sign-in:
    post:
      tags:
        - Authentication
      summary: Connexion utilisateur
      description: Permet à un utilisateur existant de se connecter et retourne un token JWT
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                  example: "alice@example.com"
                password:
                  type: string
                  format: password
                  example: "password123"
      responses:
        '200':
          description: Connexion réussie
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Connexion réussie"
                  token:
                    type: string
                    example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
                  user:
                    $ref: '#/components/schemas/User'

        '400' :
          description: Informations manquantes ou invalides
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "[ERREUR] Information(s) manquante(s)"
                $ref: '#/components/schemas/Error'

        '401':
          description: Utilisateur non trouvé 
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "[ERREUR] Utilisateur inconnu"
                $ref: '#/components/schemas/Error'

        '401':
          description: Email ou mot de passe incorrect
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "[ERREUR] Email ou mot de passe incorrect"
                $ref: '#/components/schemas/Error'

        '500':
          description: Erreur serveur
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "[ERREUR] Erreur serveur"
                $ref: '#/components/schemas/Error'
